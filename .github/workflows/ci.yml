name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # One runner image. A matrix of two ran the whole suite twice on every push and every PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # SPEC 2.6 makes uv part of the runtime contract, and GitHub's ubuntu runners do not ship it.
      # v7 is the newest floating major tag astral-sh publishes: v8 and up only ever exist as point
      # releases, so `@v10` is not a ref and the job dies before a single step runs. Check
      # `git ls-remote --tags https://github.com/astral-sh/setup-uv` before bumping this.
      - uses: astral-sh/setup-uv@v7
        with:
          # Blocks pin their Python dependencies inline (SPEC 2.7), so there is no lockfile in this
          # repo for the action to key a cache on. Say so rather than let it miss every run.
          enable-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # An engine checks this exact list at startup and refuses to start without it (SPEC 2.6), so a
      # runner image that drops one makes every engine test fail for a reason the log should name.
      # `cat`, `mv` and `wc` stand in for coreutils, the same way the engine's check does. Nothing here
      # installs anything: uv and bun come from the steps above, the rest ship with the runner image,
      # so this is a guard against an image dropping one, not setup.
      - name: The runtimes a block may use are on PATH
        run: |
          missing=()
          for tool in bash uv bun awk curl grep gzip jq sed tar cat mv wc; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            echo "runtime_missing: missing on PATH: ${missing[*]}" >&2
            exit 1
          fi
          bash --version | head -1
          uv --version
          bun --version
      # The UI smoke tests (BASHR-40) drive the browser the runner image ships, Google Chrome. They
      # skip themselves when there is none, because a laptop without
      # Chromium should still be able to run the suite, which would make a missing browser on CI a
      # green run that tested nothing. So the job checks, with the same names
      # apps/web/src/client/browser.testkit.ts looks for, and says the reason.
      - name: A browser for the UI smoke tests is on PATH
        run: |
          if [ -n "${BASHREACTOR_BROWSER:-}" ]; then
            test -x "$BASHREACTOR_BROWSER" || {
              echo "browser_missing: BASHREACTOR_BROWSER is $BASHREACTOR_BROWSER, which is not executable" >&2
              exit 1
            }
            echo "browser: $BASHREACTOR_BROWSER"
            "$BASHREACTOR_BROWSER" --version
          else
            for name in google-chrome google-chrome-stable chromium chromium-browser chrome; do
              if command -v "$name" > /dev/null; then
                echo "browser: $(command -v "$name")"
                "$name" --version
                exit 0
              fi
            done
            echo "browser_missing: no Chromium or Google Chrome on PATH, so the UI smoke tests would skip and prove nothing" >&2
            exit 1
          fi
      # Before the tests, so a bundle that will not build is reported as a build failure and not as a
      # container that silently refuses to connect.
      - run: bun run build
      - run: bun run test

  # deploy.yml only runs on main and on PRs and pushes straight to the registry, so this is the one place
  # a branch learns that the image it would ship actually starts and answers.
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=ci-test -t bashreactor:ci .
      - name: Run the image and probe it
        run: |
          docker run -d --name app -p 8080:8080 bashreactor:ci
          trap 'docker logs app; docker rm -f app' EXIT

          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-all-errors \
            http://localhost:8080/healthz | tee /dev/stderr | grep -q '"version":"ci-test"'

          # `/` is not a dead end for a person who types the host into a browser: it redirects to the
          # UI, and following it has to land on the app bundle.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/)
          test "$status" = 302
          curl --silent --show-error --fail --retry 20 --retry-delay 1 --retry-all-errors -L \
            http://localhost:8080/ | grep -q '/app/assets/app.js'

          test "$(docker exec app id -u)" = 10001

          # The image is what production runs, and an engine inside it refuses to start unless all of
          # these resolve on PATH (SPEC 2.6). Busybox covers awk, grep, gzip, sed, tar and coreutils;
          # bash, curl, jq and uv have to come from the runtime stage.
          docker exec app sh -c 'for t in bash uv bun awk curl grep gzip jq sed tar cat mv wc; do command -v "$t" > /dev/null || { echo "runtime_missing: missing on PATH: $t"; exit 1; }; done'
          # Resolving on PATH is not enough: a binary that cannot link is on PATH and useless.
          docker exec app sh -c 'uv --version && jq --version && bun --version'

      - name: Run the worked example inside it
        env:
          # Without an admin token the API is switched off entirely (apps/api/src/config.ts), so this
          # is what makes the container answer /v1 at all. It is a throwaway container on a throwaway
          # runner: the value exists for this job and is a secret nowhere else.
          BASHREACTOR_ADMIN_TOKEN: ci-image-check
        run: |
          # A second container, because the step above removes the first one in its own trap and a
          # step that starts something has to clean up after itself. Everything the example runs —
          # including count-words, which makes uv fetch a musl CPython as uid 10001 — happens in
          # there and never on the runner. That is the point: `command -v uv` above only proves the
          # binary is on PATH, and this example is the only thing that has ever run it.
          docker run -d --name example -p 8080:8080 -e BASHREACTOR_ADMIN_TOKEN bashreactor:ci
          trap 'docker logs example; docker rm -f example' EXIT

          for i in $(seq 1 30); do curl -sf localhost:8080/healthz >/dev/null && break; sleep 1; done

          # curl and jq only, so the runner installs nothing to prove the image works. The admin
          # token is the only one this container knows, and it passes every scope check (auth.ts).
          BASHREACTOR_URL=http://localhost:8080 BASHREACTOR_TOKEN="$BASHREACTOR_ADMIN_TOKEN" examples/image-demo.sh
