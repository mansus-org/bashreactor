# Deploy settings for bashreactor.mansus.org on the mansus.org cluster.
# All options: charts/app/values.yaml in nemoNoboru/k3s-hetzner-gitops.
# Previews (bashreactor-pr-<N>.mansus.org) use the same values: their own empty volume.

ingress:
  host: bashreactor.mansus.org

port: 8080
# The one port carries everything the image serves: /app, /v1, /mcp and /healthz. The ingress below
# routes / Prefix to it, so the MCP endpoint is published by the same rule as the site and needs no
# path of its own.

# $BASHREACTOR_HOME: runs/ and home/ for the engine, store/ for the store, stage/ for staging,
# tokens.json for the tokens (SPEC 1.4). Resuming a run after a rollout depends on this surviving
# the pod, so it is a volume and not an emptyDir.
persistence:
  enabled: true
  size: 1Gi
  mountPath: /data

# The image runs as 10001 with no writable home; fsGroup makes the local-path volume writable by it.
podSecurityContext:
  fsGroup: 10001

env:
  # The image already defaults to this. Set here too, so the mount path and the directory the
  # server writes to cannot drift apart when one of the two changes.
  BASHREACTOR_HOME: /data
  # The sha256 of the admin token, never the token. Optional because previews run in another
  # namespace and cannot decrypt this secret: they start with the API off instead of failing.
  BASHREACTOR_ADMIN_TOKEN_SHA256:
    secretKeyRef: { name: bashreactor-secrets, key: BASHREACTOR_ADMIN_TOKEN_SHA256, optional: true }

sealedSecrets:
  - name: bashreactor-secrets
    encryptedData:
      BASHREACTOR_ADMIN_TOKEN_SHA256: 

healthCheck:
  path: /healthz

# Measured on the built entry (dist/server.js) with the UI, the API and /mcp all answering: 68 MB
# idle, 73 MB after a few requests. The request is set above that so the scheduler accounts for what
# the pod actually uses; the limit leaves room for a big log page and for bun's heap to grow.
resources:
  requests: { cpu: 10m, memory: 128Mi }
  limits: { memory: 256Mi }
